# piper output module for Speech Dispatcher via the generic plugin.
# User override of /etc/speech-dispatcher/modules/piper.conf
# Adds sentence/chunk length tuning for Foliate book reading.
# See https://github.com/brailcom/speechd/blob/master/doc/speech-dispatcher.texi
#
# Phase 1: synthesis goes through the warm wyoming-piper server
# (see install_tts.sh) instead of spawning piper-tts per chunk.

Debug 0

GenericExecuteSynth \
"printf %s \'$DATA\' | /home/sebas/.local/bin/wyoming-say $VOICE"

GenericCmdDependency "piper-tts"
GenericCmdDependency "paplay"
GenericCmdDependency "jq"
GenericSoundIconFolder "/usr/share/sounds/sound-icons/"

GenericDefaultCharset "utf-8"

# --- Sentence / chunk length tuning ---
# Split into chunks at these characters (only when followed by space),
# otherwise hard-cut after GenericMaxChunkLength chars.
# ".?!;" = whole sentences, good intonation on fast machines.
# Add "," / ":" here only if you want shorter, faster (more robotic) chunks.
GenericDelimiters ".?!"
GenericMaxChunkLength 2000

AddVoice	"en"	"MALE1"		"/usr/share/piper-voices/en/en_US/lessac/medium/en_US-lessac-medium.onnx"
AddVoice	"en"	"MALE2"		"/usr/share/piper-voices/en/en_US/ryan/high/en_US-ryan-high.onnx"
AddVoice	"en"	"FEMALE1"	"/usr/share/piper-voices/en/en_US/amy/medium/en_US-amy-medium.onnx"
AddVoice	"en"	"FEMALE2"	"/usr/share/piper-voices/en/en_US/amy/low/en_US-amy-low.onnx"
AddVoice	"en"	"FEMALE3"	"/usr/share/piper-voices/en/en_US/lessac/high/en_US-lessac-high.onnx"
AddVoice	"en"	"CHILD_MALE"	"/usr/share/piper-voices/en/en_US/kristin/medium/en_US-kristin-medium.onnx"

DefaultVoice	"/usr/share/piper-voices/en/en_US/lessac/medium/en_US-lessac-medium.onnx"

GenericRateForceInteger 0
GenericRateMultiply 0
GenericRateAdd 0
GenericPitchMultiply 0
GenericPitchAdd 0
